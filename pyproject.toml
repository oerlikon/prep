[project]
name = "prep"
version = "0.1.0"
description = "Prep"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.4.2",
    "polars>=1.38.1",
    "pyyaml>=6.0.3",
    "requests>=2.32.5",
    "types-pyyaml>=6.0.12.20250915",
    "types-requests>=2.32.4.20260107",
    "tzdata>=2026.2",
    "websockets>=16.0",
]

[dependency-groups]
dev = [
    "black>=26.1.0",
    "isort>=8.0.1",
    "mypy>=1.19.1",
    "pyright>=1.1.408",
    "ruff>=0.15.4",
]
